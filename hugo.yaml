baseURL: "https://example.com/"
languageCode: "en-uk"
title: "James Humphries"
theme: "PaperMod"

pagination:
  pagerSize: 6

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

params:
  env: production
  defaultTheme: auto
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  math: true

  homeInfoParams:
    Title: "What's New: "
    Content: |
      Welcome to my page. Here I will post about my ongoing research, 
      topics or problems that I find interesting, to document my academic work and, generally, to record what I'm up to.
      

  socialIcons:
    - name: github
      url: "https://github.com/JHHumphries"
    - name: linkedin
      url: "https://www.linkedin.com/in/humphries-james/"
    - name: email
      url: "mailto:james.humphries@warwick.ac.uk"


menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 5
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 50
    - identifier: about
      name: About
      url: /about/
      weight: 10

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["\\[", "\\]"]
            - ["$$", "$$"]
          inline:
            - ["\\(", "\\)"]
  highlight:
    noClasses: false
